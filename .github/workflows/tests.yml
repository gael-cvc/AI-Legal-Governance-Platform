name: Tests CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # On n'installe PAS requirements.txt complet — faiss-cpu, sentence-transformers
        # et torch sont trop lourds pour la CI et inutiles pour les tests unitaires.
        # Les tests unitaires testent uniquement les fonctions pures (auth, guardrail,
        # injection defense, audit log) qui ne dépendent que de ces packages légers.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install PyJWT cryptography
          pip install fastapi pydantic python-dotenv

      - name: Run unit tests
        env:
          JWT_SECRET_KEY: "ci_test_secret_key_not_production_32chars"
          DISABLE_DISCLAIMER: "false"
          TRANSFORMERS_OFFLINE: "1"
          AUDIT_LOG_DIR: "/tmp/test_audit_logs"
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Show test summary
        if: always()
        run: |
          python -m pytest tests/ --tb=no -q 2>/dev/null || true
